<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Newport Residential Inventory</title>

<!-- Newport custom styles -->
<link rel="stylesheet" href="newportstyles.css">

<!-- ArcGIS Maps SDK -->
<link
    rel="stylesheet"
    href="https://js.arcgis.com/4.34/esri/themes/light/main.css"
>

<script src="https://js.arcgis.com/4.34/"></script>
```

</head>

<body>

<!-- =====================================================
     HEADER
     ===================================================== -->

<header>
    <div class="header-inner">

```
    <div class="eyebrow">
        Residential Inventory
    </div>

    <h1>Newport</h1>

    <p>
        Explore available residences, spaces and buildings.
    </p>

</div>
```

</header>

<!-- =====================================================
     FILTERS
     ===================================================== -->

<div class="filters">

```
<div class="filter-panel">

    <div class="filter-group">

        <label for="buildingFilter">
            Building
        </label>

        <select id="buildingFilter">
            <option value="">
                All Buildings
            </option>
        </select>

    </div>


    <div class="filter-group">

        <label for="bedFilter">
            Bedrooms
        </label>

        <select id="bedFilter">

            <option value="">
                Any
            </option>

            <option value="0">
                Studio
            </option>

            <option value="1">
                1 Bedroom
            </option>

            <option value="2">
                2 Bedrooms
            </option>

            <option value="3">
                3 Bedrooms
            </option>

            <option value="4">
                4+ Bedrooms
            </option>

        </select>

    </div>


    <div class="filter-group">

        <label for="availabilityFilter">
            Availability
        </label>

        <select id="availabilityFilter">

            <option value="">
                All
            </option>

            <option value="now">
                Available Now
            </option>

        </select>

    </div>

</div>
```

</div>

<!-- =====================================================
     STATISTICS
     ===================================================== -->

<div class="stats">

```
<div class="stat">

    <div class="stat-label">
        Results
    </div>

    <div
        class="stat-value"
        id="statResults"
    >
        —
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Buildings
    </div>

    <div
        class="stat-value"
        id="statBuildings"
    >
        —
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Average Size
    </div>

    <div
        class="stat-value"
        id="statSqft"
    >
        —
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        From
    </div>

    <div
        class="stat-value"
        id="statRent"
    >
        —
    </div>

</div>
```

</div>

<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<div class="main">

```
<!-- MAP -->

<div class="map-container">

    <div id="viewDiv"></div>

</div>


<!-- INVENTORY -->

<div class="inventory-panel">

    <div class="inventory-header">

        <h2>
            Available Residences
        </h2>

        <div
            class="inventory-count"
            id="resultCount"
        >
            Loading...
        </div>

    </div>


    <div id="inventory">

        <div class="empty-state">
            Loading inventory...
        </div>

    </div>

</div>
```

</div>

<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer>

```
Newport Residential Inventory
```

</footer>
